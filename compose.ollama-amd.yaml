# compose.ollama.yaml's Ollama on an AMD graphics card (ROCm; x86-64 only), as Ollama's own instructions for Docker.
# In .env:
#   COMPOSE_FILE=compose.yaml:compose.ollama.yaml:compose.ollama-amd.yaml
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}-rocm
    devices:
      - /dev/kfd
      - /dev/dri
