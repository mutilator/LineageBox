[[system]]
id = "truenas"
name = "TrueNAS"
kind = "nas"
summary = "SCALE or Community Edition 24.10 and later (TrueNAS CORE has no Docker)"
docker_app = "Apps"
compose_how = [
  "Make the datasets first (the wizard's folders): TrueNAS can't make them while installing.",
  "Apps → Discover Apps → ⋮ (top right) → Install via YAML.",
  "Name: lineagebox. Paste the whole file into Custom Config, and Save.",
]
install_dir = "/mnt/tank/apps/lineagebox"   # "tank" is the examples' pool name: yours may differ
photos_example = "/mnt/tank/photos"
share_parent = "/mnt/tank"
network_path = '\\{host}\{share}'
docker_socket = "/var/run/docker.sock"
ssh_how = "System → Services → SSH → Start, then allow the admin to sign in with a password or key in Credentials → Users."
sudo = true
ids_how = [
  "Credentials → Users → click the user: its UID and primary group are shown.",
  "Apps usually run as apps (568) in the group apps (568).",
]
share_how = [
  "Datasets → pick the pool → Add Dataset. Name it {name} (the Apps preset suits LineageBox; SMB if the family's PCs reach it too).",
  "Under Advanced Options, give it a quota of {size} GB.",
]
quota = true
permissions_how = [
  "Datasets → the dataset → Permissions → Edit: add an entry for the user LineageBox runs as ({user}) with Modify, and apply it to what is inside.",
  "A folder the app can't write stops it from starting.",
]
detect = ["/usr/bin/midclt", "/mnt/.ix-apps"]
notes = [
  "Install via YAML has no .env: the wizard writes everything into the file.",
  "Never share or change the hidden ix-apps dataset.",
]

[[system.users]]
uid = 568
gid = 568
who = "apps, in the group apps: what TrueNAS apps run as"
documented = true

[[system.users]]
uid = 3000
gid = 3000
who = "the first user made in Credentials → Users (ids from 3000 up)"
guess = true

