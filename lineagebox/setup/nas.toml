[[system]]
id = "rootless"
name = "Rootless Docker or Podman"
kind = "other"
summary = "Containers run as you, without root"
docker_app = ""
install_dir = "~/lineagebox"
photos_example = "~/Pictures"
docker_socket = "/run/user/1000/docker.sock"
sudo = false
rootless = true
ids_how = [
  "The containers' root is you, so LineageBox runs as 0: it writes your own folders, and nothing else on the machine.",
  "Another id inside would be one of your sub-ids outside, which can't write your folders.",
]
quota = false
permissions_how = ["Nothing to change: the folders are yours."]
notes = [
  "Rootless Docker's socket is /run/user/<your id>/docker.sock (Podman's: /run/user/<your id>/podman/podman.sock).",
  "Ports below 1024 need extra setup.",
  "Keep it running after you sign out: loginctl enable-linger <you>",
  "Podman with SELinux (Fedora, RHEL) needs :z on each folder in compose.yaml.",
]

[[system.users]]
uid = 0
gid = 0
who = "you: the containers' root is the user who runs them"
