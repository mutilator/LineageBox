[[system]]
id = "qnap"
name = "QNAP"
kind = "nas"
summary = "QTS 5 or QuTS hero, with Container Station 3"
docker_app = "Container Station"
compose_how = [
  "Make the folder for LineageBox first in File Station ({install_dir}).",
  "Open Container Station → Applications → Create.",
  "Application name: lineagebox. Paste the whole file into the editor (Validate YAML checks it).",
  "Press Create. Container Station downloads LineageBox and starts it.",
]
install_dir = "/share/Container/lineagebox"
photos_example = "/share/Multimedia"
share_parent = "/share"
network_path = '\\{host}\{share}'
docker_socket = "/var/run/docker.sock"
ssh_how = "Control Panel → Network & File Services → Telnet / SSH → Allow SSH connection. Only administrators can sign in."
sudo = false   # unverified: an administrator's SSH session runs docker directly
ids_how = [
  "QTS doesn't show user ids. Sign in over SSH as an administrator and run: id <user name>",
  "It prints something like uid=500(anna) gid=100(everyone): 500 is the user id, 100 the group id.",
]
share_how = [
  "Control Panel → Privilege → Shared Folders → Create → Shared Folder. Name it {name} and pick the volume.",
  "On QuTS hero, give it a size limit of {size} GB in Storage & Snapshots (QTS has quotas per user only).",
  "Give the user LineageBox runs as Read/Write in the folder's access rights.",
]
quota = false   # QTS: per user; QuTS hero (ZFS): per folder (unverified)
permissions_how = [
  "Control Panel → Privilege → Shared Folders → the folder's Edit Shared Folder Permission icon → Local users: Read/Write for the user LineageBox runs as.",
  "With Advanced Folder Permissions or Windows ACL turned on, those decide too, however open the folder looks.",
]
detect = ["/etc/config/uLinux.conf", "/etc/config/qpkg.conf"]
model_from = "/etc/config/uLinux.conf: Model"   # unverified key name
notes = [
  "Every QNAP user is in the group everyone (100).",
  "Make the user before LineageBox first starts.",
  "Container Station doesn't read a .env file: the wizard writes everything into compose.yaml.",
  "32-bit ARM models (TS-231P3, TS-431P3 and other Alpine AL-314 ones) can't run LineageBox. ARM models with 512 MB are below Container Station's 1 GB.",
]

[[system.users]]
uid = 500
gid = 100
who = "the first user made in Control Panel (not admin), in the group everyone"
documented = true
guess = true

[[system.users]]
uid = 501
gid = 100
who = "the next user (ids go up by one)"
documented = true
guess = true

