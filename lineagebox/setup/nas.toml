# The machines LineageBox's setup wizard knows (lineagebox setup; docs/install.md#the-setup-wizard). Corrections and
# new machines are welcome: change this file alone, run `python -m pytest tests/test_setup.py`, and send a pull
# request (CONTRIBUTING.md#nas-profiles).
#
# Each [[system]] is a kind of NAS or computer. The page lists them in this order, and when the setup container can
# see the machine's files, the first whose `detect` matches is picked for you. Keys (all but id and name optional):
#
#   id, name          a short id (lowercase, dashes) and the name people know it by
#   kind              "nas", "computer" or "other": where the page lists it
#   summary           one line under its name
#   docker_app        the NAS's own app that runs compose files ("" when there is none: SSH only)
#   compose_how       how to start LineageBox from the compose file in that app, step by step
#   install_dir       a good folder for compose.yaml and the catalog; photos_example: where photos usually are
#   share_parent      shared folders are folders of this; network_path: how a Windows PC reaches one, with {host}
#                     (the machine's name) and {share} (the shared folder), for "Copy network path"
#   docker_socket     Docker's socket, for the updater
#   ssh_how, sudo     how to turn on SSH, and whether docker needs sudo there
#   ids_how           how to find a user's id and group id
#   share_how         how to make a shared folder for photos; {size} is the size limit in GB, {name} its name. A step
#                     with {size} is left out when no size was given. quota: shared folders can have a size limit
#   permissions_how   how to let the user LineageBox runs as ({user}: "uid:gid") write a folder
#   detect            what tells this machine from its files: "/path" is there, or "/path: words" has the words in it
#   model_from        "/path: key": the file and key="value" line naming the model
#   host_network      run on the machine's own network (routers: Docker's bridge network can't reach DNS there)
#   rootless          the containers' root is the person who runs Docker (rootless Docker, Podman): user 0 is right
#   windows           paths are Windows' (C:/...)
#   notes             what trips people up
#   [[system.users]]  the user and group ids to suggest, most likely first: uid, gid, who; guess = true when the
#                     number is a common one rather than a sure one, and people should check theirs;
#                     documented = true when the vendor's pages or examples give it (the page says "Vendor
#                     documented"; a guess without it says "Usual default")
#   [[system.models]] models: name, cpu, arch (amd64, arm64; armv7 and others can't run LineageBox), memory_gb as
#                     shipped, docker (false: the vendor's Docker app isn't offered for it), note
#
# Researched 2026-11-22 from vendors' pages and well-known guides (Synology's applied-model list, QNAP's Container
# Station tutorial, Unraid's and TrueNAS's docs, the OMV-Extras wiki, TerraMaster's and UGREEN's help pages,
# TRaSH Guides, linuxserver.io). Values from fewer sources say "unverified" in a comment.

# ---------------------------------------------------------------------------------------------------------------- NAS
[[system]]
id = "synology"
name = "Synology"
kind = "nas"
summary = "DSM 7.2 and later, with Container Manager"
docker_app = "Container Manager"
compose_how = [
  "In File Station, make the folder for LineageBox first ({install_dir}). Container Manager doesn't make missing folders.",
  "Open Container Manager → Project → Create.",
  "Project name: lineagebox. Path: Set Path, and pick that folder.",
  "Source: Create docker-compose.yml, and paste the whole file into the editor that opens.",
  "Press Next (leave the Web Station portal off), then Done. Container Manager downloads LineageBox and starts it.",
]
install_dir = "/volume1/docker/lineagebox"
photos_example = "/volume1/photo"
share_parent = "/volume1"
network_path = '\\{host}\{share}'
docker_socket = "/var/run/docker.sock"
ssh_how = "Control Panel → Terminal & SNMP → Terminal → Enable SSH service. Only administrators can sign in over SSH."
sudo = true
ids_how = [
  "DSM doesn't show user ids. Turn on SSH, sign in as the user and run: id",
  "It prints something like uid=1026(anna) gid=100(users): 1026 is the user id, 100 the group id.",
]
share_how = [
  "Control Panel → Shared Folder → Create → Create Shared Folder. Name it {name}, pick the volume, and press Next.",
  "Tick Enable shared folder quota and give it {size} GB (offered on Btrfs volumes only).",
  "Finish the wizard.",
]
quota = true
permissions_how = [
  "Control Panel → Shared Folder → pick the folder → Edit → Permissions → Local users: tick Read/Write for the user LineageBox runs as.",
  "Synology's shared folders use ACLs: a user without an entry there is refused, however open the folder looks.",
]
detect = ["/etc.defaults/synoinfo.conf", "/etc/synoinfo.conf"]
model_from = "/etc.defaults/synoinfo.conf: upnpmodelname"   # unverified key name
notes = [
  "Folders made in File Station or over the network belong to whoever made them, in the group users (100). Running LineageBox as the photos' owner, in group 100, is the usual match.",
  "Docker over SSH needs sudo.",
  "With several storage pools there are /volume1, /volume2 and so on: use the volume that holds the photos.",
  "32-bit models (DS218j, DS216j, DS416j, DS419slim and others with a Marvell Armada 385) can't run LineageBox. Older 64-bit ARM models (DS118, DS218, DS418, DS418j, DS119j, DS218play) have no Container Manager.",
]

[[system.users]]
uid = 1026
gid = 100
who = "the first user, made when the NAS was set up (an administrator), in the group users"
documented = true

[[system.users]]
uid = 1027
gid = 100
who = "the next user made in Control Panel → User & Group (ids go up by one)"
documented = true
guess = true

