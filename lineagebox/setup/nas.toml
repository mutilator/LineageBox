[[system]]
id = "omv"
name = "OpenMediaVault"
kind = "nas"
summary = "OMV 7 with the compose plugin"
docker_app = "Services → Compose"
compose_how = [
  "Once: install Docker from System → omv-extras, and the openmediavault-compose plugin from System → Plugins.",
  "Services → Compose → Files → Create. Name: lineagebox, and paste the whole file into File. Save.",
  "Pick the file and press Up.",
]
install_dir = "/srv/dev-disk-by-uuid-<your disk>/appdata/lineagebox"
photos_example = "/srv/dev-disk-by-uuid-<your disk>/photos"
share_parent = "/srv"
docker_socket = "/var/run/docker.sock"
ssh_how = "Services → SSH → Enabled, and put your user in the _ssh group (Users)."
sudo = true
ids_how = [
  "Over SSH: id <user name>. Users made in OMV are in the group users (100).",
]
share_how = [
  "Storage → Shared Folders → Add. Name it {name} and pick the disk. OMV has no size limits per folder.",
  "Services → SMB/CIFS → Shares → Add, to reach it from the family's PCs.",
]
quota = false
permissions_how = [
  "Storage → Shared Folders → the folder → Permissions: Read/Write for the user LineageBox runs as. A new shared folder is root's, group users, writable by that group.",
]
detect = ["/etc/openmediavault/config.xml"]
notes = [
  "Shared folders are under /srv/dev-disk-by-uuid-…: copy the path from Storage → Shared Folders (the Absolute Path column).",
]

[[system.users]]
uid = 1000
gid = 100
who = "the first user, in the group users"
guess = true

