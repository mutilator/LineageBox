[[system]]
id = "unraid"
name = "Unraid"
kind = "nas"
summary = "6.12 or 7, with the Compose Manager Plus plugin"
docker_app = "Compose Manager Plus"
compose_how = [
  "Once: Apps → search Compose Manager Plus → Install.",
  "Docker → the Compose section under the containers → Add New Stack. Name it lineagebox.",
  "Edit the stack's compose file, paste the whole file in, and Save.",
  "Press Compose Up.",
]
install_dir = "/mnt/user/appdata/lineagebox"
photos_example = "/mnt/user/photos"
share_parent = "/mnt/user"
network_path = '\\{host}\{share}'
docker_socket = "/var/run/docker.sock"
ssh_how = "Settings → Management Access → Use SSH: Yes. You sign in as root."
sudo = false
ids_how = [
  "Containers on Unraid run as nobody (99) in the group users (100): Unraid keeps every share's files that way, even those written over the network.",
]
share_how = [
  "Shares → Add Share. Name it {name}, pick where it is kept, and press Add Share.",
  "Set SMB Export so the family's PCs can reach it. Unraid shares have no size limit.",
]
quota = false
permissions_how = [
  "Tools → New Permissions puts a share's files back to nobody:users, which LineageBox can write.",
]
detect = ["/etc/unraid-version"]
notes = [
  "Keep the catalog on a cache pool if you have one (/mnt/cache/appdata/lineagebox): its database is quicker there than through /mnt/user.",
  "Never put the catalog on the flash drive.",
]

[[system.users]]
uid = 99
gid = 100
who = "nobody in the group users: the owner of every share's files, and what Unraid's containers run as"
documented = true

