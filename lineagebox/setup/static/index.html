<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LineageBox Setup</title>
<meta name="description" content="Answer a few questions and get the compose file that runs LineageBox on your NAS or computer.">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/setup.css">
<script src="static/setup.js" defer></script>
</head>
<body>
<a class="skip" href="#step">Skip to the questions</a>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img class="brand-icon" src="static/icon.svg" alt="" width="28" height="28">
      <span class="brand-name">LineageBox</span>
      <span class="brand-tag">Setup</span>
    </div>
    <div class="where" id="where" aria-live="polite"></div>
    <div class="top-actions">
      <button type="button" class="top-btn" id="toggle-preview" data-act="toggle-preview" aria-expanded="true">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13.5 7l-3 10"/></svg>
        <span class="btn-label">compose.yaml</span>
        <span class="pill-count" id="preview-badge" hidden></span>
      </button>
      <button type="button" class="top-btn quiet-btn" data-act="reset" title="Start over">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        <span class="btn-label">Start over</span>
      </button>
      <button type="button" class="top-btn icon-only" id="theme-btn" data-act="theme" aria-label="Switch color theme" title="Switch color theme">
        <svg class="ic ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="stepper-wrap" aria-label="Setup steps">
  <div class="stepper-in">
    <ol class="steps" id="steps"></ol>
  </div>
</nav>

<div class="shell" id="shell">
  <main id="step" tabindex="-1">
    <p class="loading">Loading…</p>
    <noscript><p class="note">This page needs JavaScript to make your compose file.</p></noscript>
  </main>

  <aside class="preview" id="preview" aria-label="Live compose.yaml preview">
    <div class="preview-card">
      <div class="preview-head">
        <div class="preview-title">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <h2>compose.yaml</h2>
          <span class="status-pill" id="preview-status">Building…</span>
        </div>
        <div class="preview-tools">
          <button type="button" class="code-btn" data-act="copy" id="preview-copy">Copy</button>
          <button type="button" class="code-btn" data-act="hide-preview" aria-label="Hide preview">Hide</button>
        </div>
      </div>
      <div class="stack-bar" id="stack-bar"></div>
      <div class="preview-code">
        <pre id="preview-text"></pre>
      </div>
    </div>
  </aside>
</div>

<div class="drawer-backdrop" id="drawer-backdrop" data-act="close-drawer" hidden></div>

<dialog id="browser" aria-labelledby="browser-title">
  <div class="browser-head">
    <div class="browser-title-wrap">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <h2 id="browser-title">Pick a folder</h2>
    </div>
    <button type="button" class="icon-close" data-act="close-browser" aria-label="Close">×</button>
  </div>
  <div id="browser-body"></div>
</dialog>

<div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
