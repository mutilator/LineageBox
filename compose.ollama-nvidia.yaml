# compose.ollama.yaml's Ollama on an NVIDIA graphics card. Needs the NVIDIA driver and the NVIDIA Container Toolkit on
# this machine (docs/ollama.md). In .env:
#   COMPOSE_FILE=compose.yaml:compose.ollama.yaml:compose.ollama-nvidia.yaml
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
