# The tests, then LineageBox's Docker images for linux/amd64 and linux/arm64 on GitHub's container registry
# (ghcr.io/mutilator/lineagebox, and -whisper for the speech-to-text service; metadata-action lowercases the name):
# - A version tag (v1.2.3, the same as lineagebox/__init__.py's __version__) is a release. Its images are published as
#   1.2.3, 1.2 and latest at once (a pre-release such as v1.3.0-rc.1 only as itself), and then a GitHub Release is
#   made, which is what installs look for once a day to say an update is available.
# - A push to main publishes "main" and "sha-<commit>", for trying what is coming. Never "latest".
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to commits (a moved tag can't change what runs with the token that pushes images);
# .github/dependabot.yml keeps them current.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: A release's tag is the version in the code
        if: github.ref_type == 'tag'
        run: |
          code="$(python -c 'import lineagebox; print(lineagebox.__version__)')"
          if [ "v$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in lineagebox/__init__.py ($code)"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
      # cryptography: the HTTPS tests make their own certificates (they skip without it)
      - run: pip install --disable-pip-version-check -r docker/requirements.txt pytest cryptography
      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release of a version tag
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "latest" comes with a release's version tags (flavor latest=auto), and never from a branch
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: LINEAGEBOX_REPOSITORY=${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the speech-to-text service for compose.whisper.yaml (ghcr.io/mutilator/lineagebox-whisper), with the same
      # tags, not tuned to any one processor, since it runs on other machines than this one
      - id: whisper
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-whisper
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: whisper_service/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NATIVE=OFF
          push: true
          tags: ${{ steps.whisper.outputs.tags }}
          labels: ${{ steps.whisper.outputs.labels }}
          cache-from: type=gha,scope=whisper
          cache-to: type=gha,mode=max,scope=whisper
      # only once both images are there: installs are told about a release as soon as it exists
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "LineageBox ${GITHUB_REF_NAME#v}" $pre
