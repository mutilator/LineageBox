# LineageBox's setup wizard. LineageBox's image starts its wizard in place of LineageBox until a compose file says
# LINEAGEBOX_SETUP: done, as the one the wizard writes does. Put this file in the folder LineageBox will live in (on a
# Synology, for example, /volume1/docker/lineagebox), and start it there, over SSH or as a project in your NAS's
# Docker app:
#   docker compose up -d          (sudo docker compose up -d on most NASes)
#   docker compose logs web       the address to open, with its key
# The wizard asks where the photos, the catalog and the AI helpers are. It saves the compose file that runs LineageBox
# here, in place of this one (kept beside it), and makes the catalog folder. Then start the new file the same way:
# LineageBox takes the wizard's place, in this same project. docs/install.md#the-setup-wizard explains it all.
# Set up by hand instead, with a .env file: compose.manual.yaml.
name: lineagebox

services:
  web:   # LineageBox's web service has the same name, so it replaces this one
    image: ghcr.io/mutilator/lineagebox:latest
    ports:
      - "8000:8000"   # the address LineageBox answers on afterwards, unless the wizard is told another port
    volumes:
      # this folder: the wizard saves compose.yaml here, and makes the catalog folder when it goes in here
      - .:/install
      # the whole machine, read-only: which NAS it is, its users, its folders and who owns them. Without this line
      # the wizard can't look, and you type the paths yourself
      - /:/host:ro
    # root, to look in every folder and to give what it makes to the user LineageBox will run as; only the powers
    # those need, and no others
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs: [/tmp]
    # it stops by itself after an hour unused: start it again the same way
    restart: "no"
